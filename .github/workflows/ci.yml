name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on a PR branch; let every push to main run to a
# conclusive status (CLAUDE.md calls CI the authoritative gate on the pushed ref).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & test (JDK 21, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # Mirrors compose.yaml's `db` service. Mapped to host port 5332 so the
      # tests run against the same spring.datasource.url the developer uses —
      # no SPRING_DATASOURCE_* override, nothing to drift.
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: postgres-spring-boot
          POSTGRES_USER: amigoscode
          POSTGRES_PASSWORD: password
        ports:
          - 5332:5432
        # `services:` only waits for the container to start, not for Postgres to
        # accept connections. Without this healthcheck the @SpringBootTest
        # classes race initdb and fail intermittently.
        options: >-
          --health-cmd "pg_isready -U amigoscode -d postgres-spring-boot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # `verify` = the same test run as `./mvnw test` plus the jar build, so a
      # broken graphqlcodegen plugin or spring-boot repackage also fails here.
      # spring.docker.compose.skip.in-tests=true, so this does not start a DB —
      # the `postgres` service above is it.
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          # A build that fails before the JaCoCo report goal produces no report;
          # that is not itself an error worth a log warning.
          if-no-files-found: ignore
