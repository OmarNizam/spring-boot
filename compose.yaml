services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-boot-app
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres-spring-boot
      SPRING_DATASOURCE_USERNAME: amigoscode
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_PROFILES_ACTIVE: docker
      SERVER_FORWARD_HEADERS_STRATEGY: NATIVE
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spring-boot_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 8080 || nc -z localhost 8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - full

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-reverse-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - spring-boot_db
    restart: unless-stopped
    healthcheck:
      # busybox nc's -z support is unreliable on nginx:alpine; wget --spider
      # against a real endpoint behind the proxy is a more trustworthy probe.
      # Uses 127.0.0.1, not localhost: this image's /etc/hosts resolves
      # "localhost" to ::1 only, and nginx (listening on IPv4) then refuses
      # the connection since busybox wget doesn't fall back to another address.
      test: ["CMD-SHELL", "wget -q --spider --no-check-certificate https://127.0.0.1/api/v1/software-engineers || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - full

  db:
    image: postgres:17-alpine
    container_name: postgres-spring-boot
    environment:
      POSTGRES_DB: postgres-spring-boot
      POSTGRES_USER: amigoscode
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-boot_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  spring-boot_db:
    driver: bridge

volumes:
  postgres_data:
    driver: local
