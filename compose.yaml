services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-boot-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres-spring-boot
      SPRING_DATASOURCE_USERNAME: amigoscode
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spring-boot_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -an | grep 8080 || nc -z localhost 8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - full

  db:
    image: postgres:17-alpine
    container_name: postgres-spring-boot
    environment:
      POSTGRES_DB: postgres-spring-boot
      POSTGRES_USER: amigoscode
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-boot_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigoscode"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  spring-boot_db:
    driver: bridge

volumes:
  postgres_data:
    driver: local
