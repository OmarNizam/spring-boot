spring.application.name=spring-boot

# --- Datasource: Postgres running in Docker (see compose.yaml, host port 5332) ---
spring.datasource.url=jdbc:postgresql://localhost:5332/postgres-spring-boot
spring.datasource.username=amigoscode
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update', not 'create-drop': create-drop wipes the whole schema on every JVM
# shutdown (and can drop tables mid-run under devtools restarts, leaving the app
# up with no tables). That defeats the persistent postgres_data volume in
# compose.yaml and the DataSeeder's "only seed when empty" guard.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# --- Error responses ---
# Never put the exception stack trace in the JSON error body. Boot 4 renamed this
# from server.error.* to spring.web.error.*; the default is already 'never' but
# devtools' spring-boot:run flips it to 'always', so pin it. (The 4xx bodies here
# are still Spring's default shape — a @RestControllerAdvice would replace them;
# see docs/ARCHITECTURE.md "Still open".)
spring.web.error.include-stacktrace=never


# Start the compose stack on boot, but leave Postgres running after the app stops
# (default start-and-stop would stop the container on every shutdown).
spring.docker.compose.lifecycle-management=start-only


# --- MCP server (Spring AI) ---
# Second adapter onto SoftwareEngineerService, alongside the REST controller: the
# five CRUD operations exposed as MCP tools (see SoftwareEngineerMcpTools and
# docs/ARCHITECTURE.md "The MCP server"). Served over Streamable-HTTP on the same
# 8080 servlet context at POST /mcp — no separate port or connector.
#
# protocol MUST be set explicitly: the webmvc starter's @ConditionalOnProperty
# defaults to the deprecated SSE transport (/sse + /mcp/message) when 'protocol'
# is absent — the streamable auto-config only activates on protocol=STREAMABLE.
# type=SYNC, mcp-endpoint=/mcp and the annotation scanner are already defaults.
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=software-engineers-mcp
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.instructions=Manage software engineer records (name + tech stack). \
  Tools: list-software-engineers, get-software-engineer, create-software-engineer, \
  update-software-engineer, delete-software-engineer. Engineer ids are UUID strings.
