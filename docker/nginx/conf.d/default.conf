# Plain HTTP is not served — every request is redirected to HTTPS.
# 308 (not 301/302) preserves the method and body, so a POST/PUT that follows
# the redirect isn't silently downgraded to a GET.
server {
    listen 80;
    server_name localhost;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;

    # X-Forwarded-Host/-Port are pinned rather than left unset: Tomcat's
    # RemoteIpValve (enabled by SERVER_FORWARD_HEADERS_STRATEGY=NATIVE) trusts
    # nginx as a forwarding proxy and honors whatever a client sends in these
    # headers otherwise — e.g. a client-supplied X-Forwarded-Host would leak
    # straight into a response Location header.
    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Spring AI's Streamable-HTTP MCP transport keeps a long-lived
    # text/event-stream response open and relies on the mcp-session-id
    # response header reaching the client — nginx's default buffering can
    # hang or truncate that, so this location disables it explicitly.
    location /mcp {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
